# DeepSeek-V4-Flash-0731 on one tpu7x 2x2x1 node (DP8, EP), served on Cloud DevKit.
# A scorer arm retargets `repo` to its own tree, and every value below that starts with
# `repo` moves with it, so the arm's src/ and this directory's shim are its own.
[target]
adapter = "vllm_torchtpu"
role = "baseline"
repo = "~/vllm-torchtpu"
kernel_dirs = ["src/vllm_torchtpu/kernels", "src/vllm_torchtpu/layers"]
source_dirs = ["src"]

[target.env]
PYTHONPATH = "~/vllm-torchtpu/src"
# The dry run perfkit reads the serve command from needs a findable vllm package.
PATH = "~/vllm-torchtpu/scripts/kernel_evolve/dsv4_flash_layers/shim/bin:/usr/local/bin:/usr/bin:/bin"

[target.cdk]
# A copy of the CI image vllm-torchtpu:2d241c2e9c9ccc6e9d8b349139d471b117eef8e1-v0.32.0
# in a registry with no cleanup policy: the same image config (sha256:0c0f8d72f837...)
# and layers as the CI index sha256:38737d12f645.... jax 0.11.2, libtpu 0.0.50.
image = "us-central1-docker.pkg.dev/cloud-tpu-inference-test/forge-arms/vllm-torchtpu@sha256:082f4c6e241fb6e162d31f38168d6789f3269acb917d5e9aa64cbffe079474a7"
topology = "2x2x1"
timeout_minutes = 240

[target.cdk.env]
# The cluster's own copy of the checkpoint. With MODEL_URI the server streams it, and a
# layer arm's loader filter fetches only the layers its cut keeps.
MODEL_URI = "gs://cloud-devkit/ckpt/hf/deepseek-ai/DeepSeek-V4-Flash-0731"
