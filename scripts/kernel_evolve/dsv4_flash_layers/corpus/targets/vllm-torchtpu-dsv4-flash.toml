# DeepSeek-V4-Flash-0731 on one tpu7x 2x2x1 node (DP8, EP), served on Cloud DevKit.
# `repo` is relative: a scorer arm runs with its own tree as the working directory, so
# the arm's benchmark config, src/ and dry-run shim are read from that tree on any host.
[target]
adapter = "vllm_torchtpu"
role = "baseline"
repo = "."
kernel_dirs = ["src/vllm_torchtpu/kernels", "src/vllm_torchtpu/layers"]
source_dirs = ["src"]

[target.env]
PYTHONPATH = "src"
# The dry run perfkit reads the serve command from needs a findable vllm package.
PATH = "scripts/kernel_evolve/dsv4_flash_layers/shim/bin:/usr/local/bin:/usr/bin:/bin"

[target.cdk]
# A copy of the CI image vllm-torchtpu:2d241c2e9c9ccc6e9d8b349139d471b117eef8e1-v0.32.0
# in a registry with no cleanup policy, pinned by the CI index digest the forge-arms tag
# resolves to. jax 0.11.2, libtpu 0.0.50.
image = "us-central1-docker.pkg.dev/cloud-tpu-inference-test/forge-arms/vllm-torchtpu@sha256:38737d12f645c60d4dd88e1fbc4d1dc296c4a4c7f1db1a9a7f2849fbed9ac311"
topology = "2x2x1"
timeout_minutes = 240

[target.cdk.env]
# The cluster's own copy of the checkpoint. With MODEL_URI the server streams it, and a
# layer arm's loader filter fetches only the layers its cut keeps.
MODEL_URI = "gs://cloud-devkit/ckpt/hf/deepseek-ai/DeepSeek-V4-Flash-0731"
